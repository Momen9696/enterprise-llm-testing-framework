[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-llm-testing-framework"
version = "1.0.0"
description = "Deterministic evaluation framework for LLM quality, grounding, safety, and regression."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Momen9696"}]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.10",
  "jsonschema>=4.23",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "numpy>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40"]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "bandit>=1.8",
  "pip-audit>=2.7",
]

[project.scripts]
llm-eval = "llm_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "dashboard", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/llm_eval/api/app.py" = ["B008"]
"scripts/generate_sample_reports.py" = ["E402"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
