name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests dashboard scripts
      - name: Static security scan
        run: bandit -r src scripts dashboard -ll
      - name: Secret scan
        run: python scripts/scan_secrets.py
      - name: Unit and integration tests
        run: pytest
      - name: Deterministic evaluation report
        run: python scripts/generate_sample_reports.py
      - name: Dependency security audit
        run: pip-audit
      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: reports/samples
          if-no-files-found: error
